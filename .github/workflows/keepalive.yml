name: Keep Supabase awake

# Supabase pauses a free project after 7 days without activity. Once a day this
# calls keepalive() from supabase/schema.sql, which overwrites one timestamp row.
# Running daily leaves room for the scheduled runs GitHub sometimes skips.

on:
  schedule:
    - cron: "23 14 * * *" # daily at 14:23 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write the timestamp
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 30 --retry-all-errors \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
      # GitHub turns off scheduled workflows in a public repo after 60 days
      # without a commit. Re-enabling this one on every run keeps it on.
      - name: Stay enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/keepalive.yml/enable"
